[project]
name = "pdf-a11y"
version = "1.0.0"
description = "Batch accessibility remediation for untagged PDFs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pikepdf==9.10.2",
    "pymupdf==1.26.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
